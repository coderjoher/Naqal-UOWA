<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Request your daily university bus, see your seat and pay at the office.">
  <meta name="theme-color" content="#EEF2F8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="نقل وارث">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>نقل وارث — الطالب</title>
  <style>
    html, body { margin: 0; height: 100%; background: #EEF2F8; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity .25s ease; }
    #splash img { width: 72px; height: 72px; border-radius: 18px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(.94); opacity: .8; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
