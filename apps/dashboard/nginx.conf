map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # NF-11 / T8-03: browser hardening. Map tiles come from the VITE_MAP_TILES host(s) (filled in
  # by the Dockerfile in place of __MAP_ORIGINS__), fonts from Google Fonts,
  # MapLibre runs its workers from blob: URLs; errors may go to Sentry when configured.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: __MAP_ORIGINS__; connect-src 'self' ws: wss: __MAP_ORIGINS__ https://*.ingest.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  # Same-origin API: /api/* → NestJS
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    # WebSocket upgrade for live tracking (Socket.IO at /api/socket.io/).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA routes
  location / {
    try_files $uri /index.html;
  }
}
