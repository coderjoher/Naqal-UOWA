# Local stack: PostgreSQL (PostGIS), Redis, OSRM, API, dashboard, student and driver web apps.
#   docker compose up -d --build --wait
#   http://localhost:8080  dashboard (office / super admin)
#   http://localhost:8081  student app (web)        http://localhost:8082  driver app (web)
#   http://localhost:3000/docs  API docs
# First start downloads the Iraq map extract and prepares OSRM, and builds the Flutter apps
# (several minutes; cached afterwards). Demo data is loaded once — see docs/TESTING.md.
# Set DEMO=false for an empty database and real SMS codes (no codes shown on screen).
#
# Optional profiles (P8):
#   docker compose --profile backup up -d          nightly PostgreSQL backups into ./backups
#   docker compose --profile observability up -d   Prometheus :9090, Grafana :3001, Jaeger :16686
#   docker compose --profile https up -d           HTTPS with Let's Encrypt (see infra/caddy/Caddyfile)

services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: naql
      POSTGRES_PASSWORD: naql
      POSTGRES_DB: naql
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U naql']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  osrm-download:
    image: curlimages/curl:8.11.1
    user: root
    command: ['sh', '-c', '[ -f /data/iraq-latest.osm.pbf ] || curl -fsSL -o /data/iraq-latest.osm.pbf https://download.geofabrik.de/asia/iraq-latest.osm.pbf']
    volumes: [osrm:/data]

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    entrypoint: ['/bin/sh', '/prepare.sh']
    volumes:
      - osrm:/data
      - ./infra/osrm/prepare.sh:/prepare.sh:ro
    depends_on:
      osrm-download: { condition: service_completed_successfully }

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/iraq-latest.osrm
    ports: ['5000:5000']
    volumes: [osrm:/data]
    depends_on:
      osrm-prepare: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://naql:naql@postgres:5432/naql
      REDIS_URL: redis://redis:6379
      OSRM_URL: http://osrm:5000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789}
      PORT: 3000
      # Demo mode: load demo data once and show driver sign-in codes in the app instead of SMS.
      DEMO_SEED: ${DEMO:-true}
      OTP_DEV_ECHO: ${DEMO:-true}
      STORAGE_DIR: /data/storage
      # One process per core; metrics of all of them on :9464 (P8).
      API_WORKERS: ${API_WORKERS:-2}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Traces go to Jaeger when the observability profile runs (ignored when nothing listens).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes: [storage:/data/storage]
    ports: ['3000:3000', '9464:9464']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      osrm: { condition: service_started }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 24

  dashboard:
    build: { context: ., dockerfile: apps/dashboard/Dockerfile }
    ports: ['8080:80']
    depends_on:
      api: { condition: service_started }

  student-web:
    build: { context: ., dockerfile: infra/flutter-web/Dockerfile, args: { APP: student_app } }
    ports: ['8081:80']
    depends_on:
      api: { condition: service_started }

  driver-web:
    build: { context: ., dockerfile: infra/flutter-web/Dockerfile, args: { APP: driver_app } }
    ports: ['8082:80']
    depends_on:
      api: { condition: service_started }

  # ── P8 operations (opt-in profiles) ─────────────────────────────────────────

  backup:
    profiles: [backup]
    build: { context: infra/backup }
    environment:
      DATABASE_URL: postgresql://naql:naql@postgres:5432/naql
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes: ['./backups:/backups']
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['9090:9090']

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3001:3000']

  https:
    profiles: [https]
    image: caddy:2.9-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      STUDENT_DOMAIN: ${STUDENT_DOMAIN:-}
      DRIVER_DOMAIN: ${DRIVER_DOMAIN:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    ports: ['80:80', '443:443']
    depends_on: [dashboard, student-web, driver-web]

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.64.0
    environment: { COLLECTOR_OTLP_ENABLED: 'true' }
    ports: ['16686:16686', '4318:4318']

volumes:
  caddy:
  pgdata:
  osrm:
  storage:
