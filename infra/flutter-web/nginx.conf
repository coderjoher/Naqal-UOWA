map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # NF-11 / T8-03: browser hardening (headers repeat in locations that add their own).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

  # Same-origin API: the apps call /api/* (see naql_app apiBaseUrl()).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    # WebSocket upgrade for live tracking (Socket.IO at /api/socket.io/).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Always fetch the entry points fresh so a rebuild shows up immediately.
  location ~ ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|manifest\.json)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
