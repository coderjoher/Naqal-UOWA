map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the apps call /api/* (see naql_app apiBaseUrl()).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    # WebSocket upgrade for live tracking (Socket.IO at /api/socket.io/).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Always fetch the entry points fresh so a rebuild shows up immediately.
  location ~ ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|manifest\.json)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
