name: Android test builds

# Installable APKs of the student and driver apps for testing (demo builds: the server address
# can be changed on the welcome screen). Every push to main (and every manual run) replaces the
# files of the "demo-apk" release: Releases → "Demo APKs" → naql-student.apk / naql-driver.apk.
# (Release files do not count against the Actions artifact storage quota.)
on:
  push:
    branches: [main]
  pull_request:
    paths: ['apps/student_app/**', 'apps/driver_app/**', 'packages/naql_*/**', '.github/workflows/apps.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API address baked in as the default (e.g. http://192.168.1.20:3000/). Empty = Android emulator → host.'
        required: false
        default: ''

permissions:
  contents: write   # publish the demo-apk release

jobs:
  apk:
    name: APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        app: [student_app, driver_app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.6, channel: stable, cache: true }
      - run: flutter pub get
      - name: Build release APK (debug-signed, demo mode)
        working-directory: apps/${{ matrix.app }}
        env:
          API_URL: ${{ inputs.api_url }}
        run: flutter build apk --release --dart-define=DEMO=true ${API_URL:+--dart-define=API_URL=$API_URL}
      # Pull requests only prove the APK builds; main and manual runs publish it.
      - name: Publish to the "Demo APKs" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: |
          name="naql-${APP%_app}.apk"
          cp "apps/$APP/build/app/outputs/flutter-apk/app-release.apk" "$name"
          notes="Demo builds of the student and driver apps from ${GITHUB_SHA::7}. On first start tap the server icon and enter your server, e.g. https://naql-app.duckdns.org/api (see docs/DEPLOY-AWS.md)."
          # Both matrix jobs may arrive first: create once, tolerate the other having just created it.
          gh release view demo-apk > /dev/null 2>&1 \
            || gh release create demo-apk --title "Demo APKs (latest main)" --notes "$notes" --prerelease --target "$GITHUB_SHA" \
            || gh release view demo-apk > /dev/null
          gh release upload demo-apk "$name" --clobber
          gh release edit demo-apk --notes "$notes"
