name: CI

# Every suite must pass for a PR to merge (FD-02). Nothing here may use continue-on-error
# or swallow exit codes — scripts/tests/ci-contract.test.mjs enforces that.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node packages/design-tokens/generate.mjs --check
      - run: node --test packages/design-tokens/test/*.test.mjs scripts/tests/*.test.mjs

  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: naql, POSTGRES_PASSWORD: naql, POSTGRES_DB: naql_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U naql" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    defaults:
      run: { working-directory: apps/api }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: pdftotext for receipt tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm install --frozen-lockfile --filter @naql/api
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - name: Unit tests (+ coverage gate on auth & tenancy)
        run: pnpm test:cov
      - name: Integration + e2e tests (real PostgreSQL & Redis)
        run: pnpm test:int
      - run: pnpm build

  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    # The `full` Playwright project drives the real API against these services.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: naql, POSTGRES_PASSWORD: naql, POSTGRES_DB: naql_e2e }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U naql" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    defaults:
      run: { working-directory: apps/dashboard }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: pdftotext for receipt tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: pnpm install --frozen-lockfile --filter @naql/dashboard --filter @naql/api
      - run: pnpm lint
      - run: pnpm test
      - name: Build API for end-to-end tests
        working-directory: apps/api
        run: pnpm exec prisma generate && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (mocked + full stack)
        run: pnpm test:e2e
        env: { E2E_FULL: '1' }
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: apps/dashboard/test-results }

  flutter:
    name: Flutter (naql_ui, naql_core, naql_app, student_app, driver_app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.6, channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze packages/naql_ui packages/naql_core packages/naql_app apps/student_app apps/driver_app
      - name: naql_ui (goldens + widget tests)
        run: flutter test
        working-directory: packages/naql_ui
      - name: naql_core
        run: flutter test
        working-directory: packages/naql_core
      - name: naql_app
        run: flutter test
        working-directory: packages/naql_app
      - name: student_app
        run: flutter test
        working-directory: apps/student_app
      - name: driver_app
        run: flutter test
        working-directory: apps/driver_app
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: golden-failures, path: '**/test/failures' }

  compose:
    name: Docker Compose stack (T0-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache OSRM data
        uses: actions/cache@v4
        with:
          path: /tmp/osrm-volume
          key: osrm-iraq-${{ hashFiles('infra/osrm/prepare.sh') }}
      - name: Restore OSRM volume
        run: |
          docker volume create naql-uowa_osrm
          if [ -d /tmp/osrm-volume ]; then
            docker run --rm -v naql-uowa_osrm:/data -v /tmp/osrm-volume:/backup alpine sh -c 'cp -a /backup/. /data/'
          fi
      - name: Start stack
        run: docker compose -p naql-uowa up -d --build --wait --wait-timeout 1200
      - name: Health is OK within 60 s
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:3000/health) && echo "$body" && echo "$body" | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          docker compose -p naql-uowa logs api osrm
          exit 1
      - name: Real OSRM builds a 50-point Karbala matrix in under 30 s (P1 exit gate)
        run: |
          coords=$(python3 -c "import random; random.seed(7); print(';'.join(f'{44.0+random.uniform(-0.12,0.12):.5f},{32.6+random.uniform(-0.1,0.1):.5f}' for _ in range(51)))")
          start=$(date +%s.%N)
          body=$(curl -fsS "http://localhost:5000/table/v1/driving/${coords}?annotations=duration,distance")
          secs=$(echo "$(date +%s.%N) - $start" | bc)
          echo "matrix in ${secs}s"
          echo "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['code']=='Ok' and len(d['durations'])==51, d.get('code')"
          python3 -c "import sys; sys.exit(0 if float('$secs') < 30 else 1)"
      - name: Dashboard is served and proxies the API
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health | grep -q '"db":"ok"'
      - name: Student and driver web apps are served and proxy the API
        run: |
          for port in 8081 8082; do
            curl -fsS http://localhost:$port/ | grep -q 'flutter_bootstrap.js'
            curl -fsS http://localhost:$port/main.dart.js -o /dev/null
            curl -fsS http://localhost:$port/api/public/universities | grep -q '"slug":"warith"'
          done
      - name: Demo data is loaded and a student can sign in
        run: |
          curl -fsS -X POST http://localhost:3000/auth/student/login -H 'content-type: application/json' \
            -d '{"university":"warith","studentId":"W-1001","password":"student123"}' | grep -q accessToken
          curl -fsS -X POST http://localhost:3000/auth/driver/otp -H 'content-type: application/json' -d '{"phone":"07800000001"}' | grep -q devCode
      - name: Save OSRM volume
        if: success()
        run: |
          mkdir -p /tmp/osrm-volume
          # Files are created by root inside the container; make them readable so actions/cache can archive them.
          docker run --rm -v naql-uowa_osrm:/data -v /tmp/osrm-volume:/backup alpine sh -c 'cp -a /data/. /backup/ && chmod -R a+rX /backup'
      - name: Security headers on the API and the web apps (T8-03)
        run: |
          h=$(curl -fsSI http://localhost:3000/public/universities)
          echo "$h" | grep -qi '^x-content-type-options: nosniff' && echo "$h" | grep -qi '^strict-transport-security:' && ! echo "$h" | grep -qi '^x-powered-by'
          h=$(curl -fsSI http://localhost:8080/)
          echo "$h" | grep -qi "^content-security-policy: default-src 'self'" && echo "$h" | grep -qi '^x-frame-options: DENY'
          h=$(curl -fsSI http://localhost:8081/)
          echo "$h" | grep -qi '^x-frame-options: DENY' && echo "$h" | grep -qi '^x-content-type-options: nosniff'
      - name: Metrics of all API workers on :9464
        run: curl -fsS http://localhost:9464/metrics | grep -q '^naql_http_request_duration_seconds_bucket'
      - name: '[T8-04] Full-day smoke: plan → run with GPS → tracking → cash fare → settlement draft'
        run: node scripts/smoke/full-day.mjs
      - name: Nightly backup and restore drill (< 1 h)
        run: |
          docker compose -p naql-uowa --profile backup build backup
          docker compose -p naql-uowa --profile backup run --rm backup now
          docker compose -p naql-uowa --profile backup run --rm backup restore-drill
      - name: '[T8-03] OWASP ZAP baseline on the dashboard and the API: no high-risk findings'
        run: |
          mkdir -p zap && chmod 777 zap
          for target in http://localhost:8080 http://localhost:3000/docs; do
            name=$(echo "$target" | sed -E 's#https?://##; s#[^a-z0-9]+#-#g')
            # Exit 1/2 = findings (judged by risk below); 3 or more = ZAP itself failed.
            rc=0
            docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t "$target" -J "$name.json" -r "$name.html" -I -m 3 || rc=$?
            if [ "$rc" -ge 3 ]; then echo "ZAP failed on $target (exit $rc)"; exit "$rc"; fi
          done
          python3 - <<'PY'
          import glob, json, sys
          high = []
          for f in glob.glob('zap/*.json'):
              for site in json.load(open(f)).get('site', []):
                  for a in site.get('alerts', []):
                      print(f"{f}: [{a['riskdesc']}] {a['name']}")
                      if a.get('riskcode') == '3':
                          high.append(a['name'])
          if not glob.glob('zap/*.json'):
              sys.exit('ZAP produced no report')
          sys.exit(f'High-risk findings: {high}' if high else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-reports, path: zap/, if-no-files-found: ignore, retention-days: 14 }
