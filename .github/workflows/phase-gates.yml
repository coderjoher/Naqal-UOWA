name: Phase gates

on:
  push:
  pull_request:

jobs:
  traceability:
    name: Requirements ↔ phases ↔ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-phases.mjs
